<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 계정 만들기 — Meridian Solutions</title>
<style>@font-face{font-family:"Pretendard Variable";src:url(assets/fonts/PretendardVariable.woff2) format("woff2");font-weight:45 920}</style>
<link rel="stylesheet" href="css/style.css">
<style>body{display:grid;place-items:center;min-height:100vh;padding:24px;background:#0B0C08}.card{background:#1C1F16;border-top:4px solid #E4F020;max-width:480px;width:100%;padding:32px 28px}pre{background:#0B0C08;border:1px solid #30342A;padding:14px;font-size:13px;white-space:pre-wrap;word-break:break-all}label.f{margin-top:12px}</style>
</head><body>
<div class="card">
  <span class="label">Staff setup</span>
  <h2 class="h2" style="font-size:26px">관리자 계정 <b>만들기</b></h2>
  <p class="lead" style="font-size:14px">아이디와 비밀번호를 정하면 config.js에 붙여 넣을 두 줄이 나옵니다. 비밀번호 원문은 어디에도 저장되지 않습니다.</p>
  <form id="f">
    <label class="f">아이디<input id="id" required autocomplete="off"></label>
    <label class="f">비밀번호<input id="pw" type="password" required autocomplete="new-password"></label>
    <label class="f">비밀번호 확인<input id="pw2" type="password" required autocomplete="new-password"></label>
    <p id="err" style="color:#E5533F;font-size:13px;min-height:1.2em"></p>
    <button class="btn primary" style="width:100%">만들기</button>
  </form>
  <div id="out" hidden>
    <p style="margin-top:20px;font-size:14px">아래 두 줄을 <b>config.js</b>의 같은 줄과 바꿔 넣고 저장소에 올리세요.</p>
    <pre id="code"></pre>
  </div>
</div>
<script src="js/hash.js"></script>
<script>
document.getElementById('f').onsubmit=async function(e){
  e.preventDefault();
  var id=document.getElementById('id').value.trim(), pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value, err=document.getElementById('err');
  if(pw!==pw2){err.textContent='비밀번호가 서로 다릅니다.';return;}
  if(pw.length<6){err.textContent='비밀번호는 6자 이상으로 정해 주세요.';return;}
  err.textContent='';
  var h=await window.MNG_hash('menagerie::'+id+'::'+pw);
  document.getElementById('code').textContent='  adminId: '+JSON.stringify(id)+',\n  passHash: "'+h+'",';
  document.getElementById('out').hidden=false;
};
</script>
</body></html>
